# Plantilla — objetivo y encuadre. Copiar a openspec/specs/<modelo>/ al nacer el modelo.
model: "<nombre-del-modelo>"
tier: 2

business_objective:
  statement: "<qué decisión de negocio mejora y para quién>"
  decision_metric: "<la métrica de negocio que se mueve, con unidad>"
  baseline_today: "<cómo se decide hoy, sin ML>"

ml_objective:
  task: "<regresión | clasificación | ranking | forecasting>"
  target: "<variable objetivo y su definición exacta>"
  optimization_metric: "<la métrica que optimiza el entrenamiento>"
  # Las dos métricas no coinciden casi nunca. Declarar cómo se relacionan.
  link_to_business: "<cómo se traduce una mejora de la métrica ML en la de negocio>"

non_goals:
  - "<qué NO resuelve este modelo, explícitamente>"

why_ml:
  justification: "<por qué una heurística o una regla no basta>"
  fallback_if_ml_fails: "<a qué se vuelve si el modelo no supera la línea base>"
