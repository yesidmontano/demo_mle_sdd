# Contrato de datos. Cada campo de aquí es comprobable por máquina.
model: "<nombre-del-modelo>"
source:
  name: "<tabla, fichero o endpoint>"
  grain: "<una fila representa: ...>"
  lineage: "<de dónde viene y quién la produce>"

schema:
  - { name: "<columna>", dtype: "<int64|float64|string|datetime64[ns]|category>", nullable: false }

constraints:
  ranges:
    - { column: "<columna>", min: 0, max: 1000000 }
  allowed_values:
    - { column: "<columna>", values: ["<a>", "<b>"] }
  uniqueness: ["<columna clave>"]
  referential:
    - { column: "<fk>", references: "<tabla.columna>" }

freshness:
  max_lag: "<p. ej. 24h>"
  on_violation: block   # block | warn

pii:
  columns: []
  handling: "<none | hash | drop>"

# Comprobable: el gate data-contract lee esta sección y falla si el dataset no la cumple.
