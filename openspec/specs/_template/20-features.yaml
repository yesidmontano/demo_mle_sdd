# Contrato de variables. Único mecanismo estructural contra train/serve skew.
model: "<nombre-del-modelo>"
point_in_time:
  # Toda feature declara qué información podía conocerse en el instante de la predicción.
  prediction_timestamp_column: "<columna>"
  max_lookback: "<p. ej. 365d>"

features:
  - name: "<nombre>"
    dtype: float64
    definition: "<fórmula o transformación, sin ambigüedad>"
    offline_source: "<ruta o consulta batch>"
    online_source: "<endpoint o caché de servicio>"
    parity: strict        # strict | tolerant
    tolerance: 0.0        # solo si parity: tolerant

leakage_guards:
  forbidden_columns: ["<columnas que solo existen después del evento>"]
  temporal_split_required: true

# Comprobable: train-serve-parity compila esta definición a ambas rutas y compara.
