model: "<nombre-del-modelo>"
io_schema:
  request:  [{ name: "<campo>", dtype: "<tipo>", required: true }]
  response: [{ name: prediction, dtype: float64 }]
compatibility:
  backward_compatible: true
  breaking_change_is: "<quitar un campo de request o cambiar su tipo>"
  on_break: require_major_version

latency:
  p99_ms: 200
  concurrency: 10
  batch_size: 1

degradation:
  on_model_unavailable: "<previous_model | heuristic | explicit_error>"
  on_invalid_input: explicit_error

rollout:
  strategy: canary       # shadow | canary | blue_green
  traffic_pct: 5
  min_duration: "<p. ej. 24h>"
  advance_if: "<condición medible>"
  auto_revert_if: "<condición medible>"

traceability:
  # Cierra el lazo con el comprobante: toda predicción es rastreable hasta la spec que la autorizó.
  emit_model_id: true
  emit_spec_pack_hash: true
