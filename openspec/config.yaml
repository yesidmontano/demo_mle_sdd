# Política del proyecto por fase. La consumen las skills sdd-* y el CLI de openspec.
schema: spec-driven
version: 1

context: |
  MLOps gobernado por especificaciones. El comportamiento del sistema lo producen tres
  artefactos —código, datos y modelo entrenado— y la especificación se extiende a los tres.
  Cada capability lleva sus requisitos en formato OpenSpec y, dentro de cada uno, un bloque
  ```yaml contract``` con el recorte que un gate ejecuta.
  Stack: Python 3.11+, pandas, scikit-learn / gradient boosting, pytest.
  Dominio: revenue en aeronáutica.

# Corte entre la vía abreviada y el ciclo completo.
tiers:
  1: { descripcion: "Decide sobre clientes o ingresos; regulado", aspectos: all, ciclo: completo,  aprobador_humano: true  }
  2: { descripcion: "Producción, impacto acotado y reversible",   aspectos: [problem, data, features, evaluation, serving, monitoring], ciclo: completo,  aprobador_humano: false }
  3: { descripcion: "Interno, exploratorio, sin consumidores",    aspectos: [problem, data, evaluation], ciclo: abreviado, aprobador_humano: false }

# El alcance del delta decide los gates: se enruta por el ASPECTO de cada capability
# tocada (el sufijo de <modelo>-<aspecto>), no por la fase del ciclo de vida.
gate_routing:
  problem:    [human-review]
  data:       [data-contract, freshness]
  features:   [train-serve-parity, leakage-check]
  training:   [reproducibility, compute-budget]
  evaluation: [slice-eval, behavioral-tests, incumbent-rerun]
  serving:    [contract-compat, latency-p99, rollback-drill]
  monitoring: [alert-backtest, false-positive-budget]
  governance: [human-review]

rules:
  proposal:
    - Declarar objetivo de negocio y objetivo de ML por separado.
    - Declarar no-objetivos explícitos antes de entrenar.
    - Si el problema se resuelve sin ML, decirlo y parar.
  specs:
    - Usar el formato OpenSpec: "### Requirement:" con SHALL y "#### Scenario:" con WHEN/THEN.
    - Todo requisito lleva dentro un bloque ```yaml contract``` comprobable, o `non_binding: true`.
    - Un umbral absoluto es sospechoso: preferir relativo a la línea base vigente.
    - Si se toca evaluation, declarar umbrales por slice, no solo agregados.
    - Un slice nuevo en evaluation se refleja también en monitoring.
  design:
    - Registrar la alternativa descartada y bajo qué condición se reconsideraría.
    - Decidir batch vs online y stateless vs stateful de forma explícita.
  tasks:
    - Cada tarea deja un artefacto verificable, no una afirmación.
  apply:
    - Nunca escribir en openspec/specs/. El cambio va en el delta del change.
    - Sellar el candidato inmediatamente después de entrenar, antes de mirar métricas.
  verify:
    - Correr únicamente los gates que activan los aspectos tocados por el delta.
    - Un gate que no puede fallar no es un gate: reportarlo como hallazgo.
  archive:
    - No fusionar sin comprobante válido.
    - Una feature sin despliegue también archiva: hallazgo o resultado negativo.

testing:
  runner:
    command: "python -m pytest -q"
    framework: pytest
  gates_dir: gates
